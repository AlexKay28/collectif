name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go vet ./...
      # -race: the unsynchronised contextWarnState map in #48 survived
      # because the suite ran without the detector. One goroutine per
      # session writes shared state, so races are the failure mode this
      # codebase is most exposed to — catch them in CI, not in a session.
      - run: go test -race ./...
      # `go build ./...` would try to write the binary to ./src, colliding
      # with the existing src/ directory. -o discards the artifact; we're
      # only checking that the source compiles.
      - run: go build -o /dev/null ./...
